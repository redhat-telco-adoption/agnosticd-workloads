---
# ---------------------------------------------------------------------------
# Deprovision — reverse order of workload.yml
# ---------------------------------------------------------------------------

# -2. MaaS Observability backend (Option B) — revert before the MaaS resources
#     below, while the Tenant and Kuadrant CRs still exist to patch. COO and the
#     DSCInitialization monitoring config are cluster-wide and may be shared, so
#     they are only touched when maas_observability_remove_coo is true.
- name: Revert MaaS Observability backend
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_observability_deploy | bool
  block:
  - name: Disable MaaS Tenant telemetry
    kubernetes.core.k8s:
      state: patched
      api_version: maas.opendatahub.io/v1alpha1
      kind: Tenant
      name: default-tenant
      namespace: "{{ ocp4_workload_rhoai3x_maas_namespace }}"
      definition:
        spec:
          telemetry:
            enabled: false
    failed_when: false

  - name: Disable Kuadrant observability
    kubernetes.core.k8s:
      state: patched
      api_version: kuadrant.io/v1beta1
      kind: Kuadrant
      name: kuadrant
      namespace: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"
      definition:
        spec:
          observability:
            enable: false
    failed_when: false

  - name: Revert DSCInitialization monitoring and remove COO (only if owned here)
    when: ocp4_workload_rhoai3x_maas_observability_remove_coo | bool
    block:
    - name: Discover the DSCInitialization resource
      kubernetes.core.k8s_info:
        api_version: dscinitialization.opendatahub.io/v2
        kind: DSCInitialization
      register: _ocp4_workload_rhoai3x_maas_dsci_rm

    - name: Set DSCInitialization monitoring back to Removed
      kubernetes.core.k8s:
        state: patched
        api_version: dscinitialization.opendatahub.io/v2
        kind: DSCInitialization
        name: "{{ _ocp4_workload_rhoai3x_maas_dsci_rm.resources[0].metadata.name }}"
        definition:
          spec:
            monitoring:
              managementState: Removed
      failed_when: false
      when: _ocp4_workload_rhoai3x_maas_dsci_rm.resources | length > 0

    - name: Remove the Cluster Observability Operator Subscription
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: cluster-observability-operator
        namespace: "{{ ocp4_workload_rhoai3x_maas_coo_namespace }}"

    - name: List ClusterServiceVersions in the COO namespace
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ ocp4_workload_rhoai3x_maas_coo_namespace }}"
      register: _ocp4_workload_rhoai3x_maas_coo_csvs

    - name: Remove the Cluster Observability Operator ClusterServiceVersion(s)
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ item.metadata.name }}"
        namespace: "{{ ocp4_workload_rhoai3x_maas_coo_namespace }}"
      loop: "{{ _ocp4_workload_rhoai3x_maas_coo_csvs.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: item.metadata.name is search('observability-operator')

# -1. Models-as-a-Service (optional feature; provisioned last, so removed first).
#     Note: User Workload Monitoring is left enabled on purpose — it is a
#     cluster-wide setting other workloads may depend on. The DSC and the
#     redhat-ods-applications namespace (which hold the maas-api/controller, MaaS
#     CRDs and the PostgreSQL Cluster) are removed later by the RHOAI teardown.
- name: Remove Models-as-a-Service resources
  when: ocp4_workload_rhoai3x_maas_enable | bool
  block:
  - name: Disable Models-as-a-Service in the DataScienceCluster (quiesce controller)
    kubernetes.core.k8s:
      state: patched
      api_version: datasciencecluster.opendatahub.io/v2
      kind: DataScienceCluster
      name: "{{ ocp4_workload_rhoai3x_dsc_name }}"
      definition:
        spec:
          components:
            kserve:
              modelsAsService:
                managementState: Removed
    failed_when: false

  # --- sample publish: governance CRs, model, group ---
  - name: Remove MaaS authorization policy
    kubernetes.core.k8s:
      state: absent
      api_version: maas.opendatahub.io/v1alpha1
      kind: MaaSAuthPolicy
      name: "{{ ocp4_workload_rhoai3x_maas_authpolicy_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_namespace }}"

  - name: Remove MaaS subscription
    kubernetes.core.k8s:
      state: absent
      api_version: maas.opendatahub.io/v1alpha1
      kind: MaaSSubscription
      name: "{{ ocp4_workload_rhoai3x_maas_subscription_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_namespace }}"

  - name: Remove MaaSModelRef
    kubernetes.core.k8s:
      state: absent
      api_version: maas.opendatahub.io/v1alpha1
      kind: MaaSModelRef
      name: "{{ ocp4_workload_rhoai3x_maas_modelref_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_sample_namespace }}"

  - name: Remove the sample LLMInferenceService
    kubernetes.core.k8s:
      state: absent
      api_version: serving.kserve.io/v1alpha1
      kind: LLMInferenceService
      name: "{{ ocp4_workload_rhoai3x_maas_sample_isvc_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_sample_namespace }}"

  - name: Remove the MaaS subscription group
    when: ocp4_workload_rhoai3x_maas_publish_sample | bool
    kubernetes.core.k8s:
      state: absent
      api_version: user.openshift.io/v1
      kind: Group
      name: "{{ ocp4_workload_rhoai3x_maas_subscription_group }}"

  # --- gateway (Route + Gateway + infra ConfigMap) ---
  - name: Remove the MaaS gateway Route
    kubernetes.core.k8s:
      state: absent
      api_version: route.openshift.io/v1
      kind: Route
      name: "{{ ocp4_workload_rhoai3x_maas_gateway_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_gateway_namespace }}"

  - name: Remove the MaaS Gateway
    kubernetes.core.k8s:
      state: absent
      api_version: gateway.networking.k8s.io/v1
      kind: Gateway
      name: "{{ ocp4_workload_rhoai3x_maas_gateway_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_gateway_namespace }}"

  - name: Remove the MaaS gateway infrastructure ConfigMap
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: ConfigMap
      name: "{{ ocp4_workload_rhoai3x_maas_gateway_config_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_gateway_namespace }}"

  # --- Connectivity Link / Kuadrant (namespace deletion cascades Authorino/Limitador) ---
  - name: Remove the Kuadrant instance
    kubernetes.core.k8s:
      state: absent
      api_version: kuadrant.io/v1beta1
      kind: Kuadrant
      name: kuadrant
      namespace: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"

  - name: Remove the kuadrant-system namespace
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Namespace
      name: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"

  # --- database secret + PostgreSQL Cluster ---
  - name: Remove the maas-db-config secret
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Secret
      name: maas-db-config
      namespace: redhat-ods-applications

  - name: Remove the PostgreSQL Cluster
    when: ocp4_workload_rhoai3x_maas_deploy_postgres | bool
    kubernetes.core.k8s:
      state: absent
      api_version: postgresql.cnpg.io/v1
      kind: Cluster
      name: "{{ ocp4_workload_rhoai3x_maas_pg_cluster_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_maas_pg_namespace }}"

  - name: Remove the PostgreSQL credentials secret
    when: ocp4_workload_rhoai3x_maas_deploy_postgres | bool
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Secret
      name: "{{ ocp4_workload_rhoai3x_maas_pg_cluster_name }}-credentials"
      namespace: "{{ ocp4_workload_rhoai3x_maas_pg_namespace }}"

  - name: Remove the models-as-a-service namespace
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Namespace
      name: "{{ ocp4_workload_rhoai3x_maas_namespace }}"

  # --- operators (Subscription + CSV only; openshift-operators is shared, so its
  #     namespace and OperatorGroup are left intact). Optional. ---
  - name: Remove the MaaS operators (Connectivity Link, cloudnative-pg)
    when: ocp4_workload_rhoai3x_maas_remove_operators | bool
    block:
    - name: Remove MaaS operator Subscriptions
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: "{{ item }}"
        namespace: "{{ ocp4_workload_rhoai3x_maas_rhcl_namespace }}"
      loop:
      - rhcl-operator
      - cloudnative-pg

    - name: List ClusterServiceVersions in openshift-operators
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ ocp4_workload_rhoai3x_maas_rhcl_namespace }}"
      register: _ocp4_workload_rhoai3x_maas_csvs

    - name: Remove MaaS operator ClusterServiceVersion(s)
      kubernetes.core.k8s:
        state: absent
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        name: "{{ item.metadata.name }}"
        namespace: "{{ ocp4_workload_rhoai3x_maas_rhcl_namespace }}"
      loop: "{{ _ocp4_workload_rhoai3x_maas_csvs.resources }}"
      when: >-
        item.metadata.name is search('rhcl-operator')
        or item.metadata.name is search('cloudnative-pg')

# 0a. AI Safety Guardrails (NeMo Guardrails) — remove before the model it guards.
# The trustyai DSC component is reverted when the DataScienceCluster is deleted
# later in this playbook, so only the namespaced objects are removed here.
- name: Remove AI Safety Guardrails resources
  when:
  - ocp4_workload_rhoai3x_guardrails_enable | bool
  - ocp4_workload_rhoai3x_model_deploy | bool
  block:
  - name: Remove NemoGuardrails resource
    kubernetes.core.k8s:
      state: absent
      api_version: trustyai.opendatahub.io/v1alpha1
      kind: NemoGuardrails
      name: "{{ ocp4_workload_rhoai3x_guardrails_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_guardrails_namespace }}"

  - name: Remove NeMo Guardrails ConfigMap
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: ConfigMap
      name: "{{ ocp4_workload_rhoai3x_guardrails_config_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_guardrails_namespace }}"

  - name: Remove NeMo Guardrails API token Secret
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Secret
      name: "{{ ocp4_workload_rhoai3x_guardrails_token_secret }}"
      namespace: "{{ ocp4_workload_rhoai3x_guardrails_namespace }}"

  - name: Remove NeMo Guardrails view RoleBinding
    kubernetes.core.k8s:
      state: absent
      api_version: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      name: "{{ ocp4_workload_rhoai3x_guardrails_sa_name }}-view"
      namespace: "{{ ocp4_workload_rhoai3x_guardrails_namespace }}"

  - name: Remove NeMo Guardrails ServiceAccount
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: ServiceAccount
      name: "{{ ocp4_workload_rhoai3x_guardrails_sa_name }}"
      namespace: "{{ ocp4_workload_rhoai3x_guardrails_namespace }}"

# 0. Gen AI Playground (LlamaStackDistribution + ConfigMap)
- name: Remove LlamaStackDistribution
  when:
  - ocp4_workload_rhoai3x_gen_ai_studio_enable | bool
  - ocp4_workload_rhoai3x_model_deploy | bool
  kubernetes.core.k8s:
    state: absent
    api_version: llamastack.io/v1alpha1
    kind: LlamaStackDistribution
    name: "{{ ocp4_workload_rhoai3x_gen_ai_playground_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"

- name: Remove Gen AI Playground LlamaStack ConfigMap
  when:
  - ocp4_workload_rhoai3x_gen_ai_studio_enable | bool
  - ocp4_workload_rhoai3x_model_deploy | bool
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ ocp4_workload_rhoai3x_gen_ai_playground_config_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"

# 1. MLflow instance
- name: Remove MLflow instance
  when: ocp4_workload_rhoai3x_mlflow_deploy | bool
  kubernetes.core.k8s:
    state: absent
    api_version: mlflow.opendatahub.io/v1
    kind: MLflow
    name: "{{ ocp4_workload_rhoai3x_mlflow_name }}"
    namespace: redhat-ods-applications

# 2. InferenceService and ServingRuntime
- name: Remove InferenceService
  when: ocp4_workload_rhoai3x_model_deploy | bool
  kubernetes.core.k8s:
    state: absent
    api_version: serving.kserve.io/v1beta1
    kind: InferenceService
    name: "{{ ocp4_workload_rhoai3x_model_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"

- name: Remove ServingRuntime
  when: ocp4_workload_rhoai3x_model_deploy | bool
  kubernetes.core.k8s:
    state: absent
    api_version: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    name: "{{ ocp4_workload_rhoai3x_model_serving_runtime_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"

# 3. DataSciencePipelineApplication
- name: Remove DataSciencePipelineApplication
  when: ocp4_workload_rhoai3x_pipeline_app_configure | bool
  kubernetes.core.k8s:
    state: absent
    api_version: datasciencepipelinesapplications.opendatahub.io/v1
    kind: DataSciencePipelinesApplication
    name: pipelines-definition
    namespace: "{{ ocp4_workload_rhoai3x_pipeline_app_project }}"

- name: Remove MinIO credentials Secret
  when: ocp4_workload_rhoai3x_pipeline_app_configure | bool
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: rhoai-pipeline-minio-secret
    namespace: "{{ ocp4_workload_rhoai3x_pipeline_app_project }}"

- name: Remove pipeline project namespace
  when: ocp4_workload_rhoai3x_pipeline_app_configure | bool
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_rhoai3x_pipeline_app_project }}"

# 4. DataScienceCluster
- name: Remove DataScienceCluster CR
  kubernetes.core.k8s:
    state: absent
    api_version: datasciencecluster.opendatahub.io/v2
    kind: DataScienceCluster
    name: "{{ ocp4_workload_rhoai3x_dsc_name }}"

- name: Wait for DataScienceCluster to be deleted
  kubernetes.core.k8s_info:
    api_version: datasciencecluster.opendatahub.io/v2
    kind: DataScienceCluster
    name: "{{ ocp4_workload_rhoai3x_dsc_name }}"
  register: _ocp4_workload_rhoai3x_dsc_deleted
  until: _ocp4_workload_rhoai3x_dsc_deleted.resources | length == 0
  retries: 20
  delay: 15

# 5. RHOAI Operator
- name: Remove RHOAI Subscription
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: Subscription
    name: rhods-operator
    namespace: "{{ ocp4_workload_rhoai3x_operator_namespace }}"

- name: Get RHOAI CSV name for removal
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp4_workload_rhoai3x_operator_namespace }}"
  register: _ocp4_workload_rhoai3x_rhoai_csvs

- name: Remove RHOAI ClusterServiceVersion(s)
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    name: "{{ item.metadata.name }}"
    namespace: "{{ ocp4_workload_rhoai3x_operator_namespace }}"
  loop: "{{ _ocp4_workload_rhoai3x_rhoai_csvs.resources }}"

- name: Remove RHOAI OperatorGroup
  kubernetes.core.k8s:
    state: absent
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    name: rhods-operator
    namespace: "{{ ocp4_workload_rhoai3x_operator_namespace }}"

- name: Remove redhat-ods-operator namespace
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_rhoai3x_operator_namespace }}"

- name: Remove redhat-ods-applications namespace (auto-created by RHOAI operator)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: redhat-ods-applications

- name: Remove rhods-notebooks namespace (auto-created by RHOAI operator)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: rhods-notebooks

- name: Remove redhat-ods-monitoring namespace (auto-created by RHOAI operator)
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: redhat-ods-monitoring

# 6. NVIDIA GPU Operator
- name: Remove NVIDIA GPU Operator resources
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  block:
  - name: Remove ClusterPolicy
    kubernetes.core.k8s:
      state: absent
      api_version: nvidia.com/v1
      kind: ClusterPolicy
      name: gpu-cluster-policy

  - name: Wait for ClusterPolicy to be deleted
    kubernetes.core.k8s_info:
      api_version: nvidia.com/v1
      kind: ClusterPolicy
      name: gpu-cluster-policy
    register: _ocp4_workload_rhoai3x_cluster_policy_deleted
    until: _ocp4_workload_rhoai3x_cluster_policy_deleted.resources | length == 0
    retries: 20
    delay: 15

  - name: Remove NVIDIA GPU Operator Subscription
    kubernetes.core.k8s:
      state: absent
      api_version: operators.coreos.com/v1alpha1
      kind: Subscription
      name: gpu-operator-certified
      namespace: "{{ ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace }}"

  - name: Get NVIDIA GPU Operator CSV name for removal
    kubernetes.core.k8s_info:
      api_version: operators.coreos.com/v1alpha1
      kind: ClusterServiceVersion
      namespace: "{{ ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace }}"
    register: _ocp4_workload_rhoai3x_nvidia_csvs

  - name: Remove NVIDIA GPU Operator ClusterServiceVersion(s)
    kubernetes.core.k8s:
      state: absent
      api_version: operators.coreos.com/v1alpha1
      kind: ClusterServiceVersion
      name: "{{ item.metadata.name }}"
      namespace: "{{ ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace }}"
    loop: "{{ _ocp4_workload_rhoai3x_nvidia_csvs.resources }}"

  - name: Remove NVIDIA GPU Operator OperatorGroup
    kubernetes.core.k8s:
      state: absent
      api_version: operators.coreos.com/v1
      kind: OperatorGroup
      name: nvidia-gpu-operator-group
      namespace: "{{ ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace }}"

  - name: Remove nvidia-gpu-operator namespace
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Namespace
      name: "{{ ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace }}"

# 7. NodeFeatureDiscovery instance and operator
# ocp4_workload_nfd remove_workload is a no-op upstream, so we own full NFD cleanup here
- name: Remove NodeFeatureDiscovery instance
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  kubernetes.core.k8s:
    state: absent
    api_version: nfd.openshift.io/v1
    kind: NodeFeatureDiscovery
    name: "{{ ocp4_workload_rhoai3x_nfd_instance_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_nfd_namespace }}"

- name: Wait for NodeFeatureDiscovery instance to be deleted
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  kubernetes.core.k8s_info:
    api_version: nfd.openshift.io/v1
    kind: NodeFeatureDiscovery
    name: "{{ ocp4_workload_rhoai3x_nfd_instance_name }}"
    namespace: "{{ ocp4_workload_rhoai3x_nfd_namespace }}"
  register: _ocp4_workload_rhoai3x_nfd_deleted
  until: _ocp4_workload_rhoai3x_nfd_deleted.resources | length == 0
  retries: 20
  delay: 15

- name: Remove NFD operator namespace (cascades Subscription, CSV, OperatorGroup)
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ ocp4_workload_rhoai3x_nfd_namespace }}"

# 8. GPU MachineSet — scale to 0 first, then delete
- name: Remove GPU MachineSet
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  block:
  - name: Get all MachineSets to find GPU MachineSet by name suffix
    kubernetes.core.k8s_info:
      api_version: machine.openshift.io/v1beta1
      kind: MachineSet
      namespace: openshift-machine-api
    register: _ocp4_workload_rhoai3x_gpu_ms_all

  - name: Filter GPU MachineSets by name suffix
    ansible.builtin.set_fact:
      _ocp4_workload_rhoai3x_gpu_ms_list:
        resources: >-
          {{ _ocp4_workload_rhoai3x_gpu_ms_all.resources |
             selectattr('metadata.name', 'search', ocp4_workload_rhoai3x_gpu_machineset_name_suffix) | list }}

  - name: Scale GPU MachineSet to 0 replicas
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: machine.openshift.io/v1beta1
        kind: MachineSet
        metadata:
          name: "{{ item.metadata.name }}"
          namespace: openshift-machine-api
        spec:
          replicas: 0
    loop: "{{ _ocp4_workload_rhoai3x_gpu_ms_list.resources }}"

  - name: Wait for GPU MachineSet replicas to reach 0
    kubernetes.core.k8s_info:
      api_version: machine.openshift.io/v1beta1
      kind: MachineSet
      name: "{{ item.metadata.name }}"
      namespace: openshift-machine-api
    register: _ocp4_workload_rhoai3x_gpu_ms_scaled
    until: >-
      _ocp4_workload_rhoai3x_gpu_ms_scaled.resources | length == 0
      or (_ocp4_workload_rhoai3x_gpu_ms_scaled.resources[0].status.replicas | default(0) | int) == 0
    retries: 20
    delay: 30
    loop: "{{ _ocp4_workload_rhoai3x_gpu_ms_list.resources }}"

  - name: Delete GPU MachineSet
    kubernetes.core.k8s:
      state: absent
      api_version: machine.openshift.io/v1beta1
      kind: MachineSet
      name: "{{ item.metadata.name }}"
      namespace: openshift-machine-api
    loop: "{{ _ocp4_workload_rhoai3x_gpu_ms_list.resources }}"

