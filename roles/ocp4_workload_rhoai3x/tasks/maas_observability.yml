---
# ---------------------------------------------------------------------------
# MaaS Observability backend (Option B).
# Makes the RHOAI "Observe & monitor -> Dashboard" (Tech Preview, rendered with
# Perses and querying Thanos Querier) actually load by deploying the monitoring
# backend it needs and turning on the metrics sources.
#
# Chain:
#   1. Cluster Observability Operator (COO) — provides the MonitoringStack CRD.
#   2. DSCInitialization.spec.monitoring.metrics -> RHOAI deploys Thanos/
#      Prometheus in redhat-ods-monitoring.
#   3. Kuadrant spec.observability.enable -> Limitador PodMonitor.
#   4. Tenant spec.telemetry -> per-subscription/model usage metrics.
#
# The observabilityDashboard UI flag (maas_enable.yml) defaults to the
# maas_observability_deploy switch, so the page is never shown without a backend.
#
# CAUTION: cluster-wide monitoring change. COO may be shared with other
# workloads (e.g. ocp4_workload_coo_incident_detection); install is idempotent
# and COO teardown is gated behind maas_observability_remove_coo.
# ---------------------------------------------------------------------------

- name: Install the Cluster Observability Operator (COO)
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: cluster-observability-operator
    install_operator_namespace: "{{ ocp4_workload_rhoai3x_maas_coo_namespace }}"
    install_operator_channel: "{{ ocp4_workload_rhoai3x_maas_coo_channel }}"
    install_operator_catalog: redhat-operators
    # When a starting CSV is pinned, approval MUST be Manual so OLM cannot auto-
    # upgrade past it (COO 1.5.0's perses-operator v0.4.0 injects --web.tls-min-version
    # which RHOAI 3.4's pinned Perses v0.51.1 rejects -> Perses CrashLoopBackOff).
    install_operator_automatic_install_plan_approval: "{{ ocp4_workload_rhoai3x_maas_coo_starting_csv == '' }}"
    install_operator_starting_csv: "{{ ocp4_workload_rhoai3x_maas_coo_starting_csv }}"

# REQUIRED second operator: without the OpenTelemetryCollector operator the RHOAI
# platform Monitoring CR (default-monitoring) blocks with "OpenTelemetryCollector
# operator must be installed for OpenTelemetry configuration" and never deploys
# the Thanos/Prometheus stack. Verified live on RHOAI 3.4.0.
- name: Install the Red Hat build of OpenTelemetry operator
  ansible.builtin.include_role:
    name: install_operator
  vars:
    install_operator_action: install
    install_operator_name: opentelemetry-product
    # The package is "opentelemetry-product" but its CSV is "opentelemetry-operator.vX".
    # install_operator's InstallPlan wait filters by CSV-name-contains <csv_nameprefix>,
    # which DEFAULTS to install_operator_name — that never matches the CSV here, so the
    # "Wait until InstallPlan is created" step loops forever. Pin the prefix to the real
    # CSV name. (COO doesn't need this: its package and CSV share a prefix.)
    install_operator_csv_nameprefix: opentelemetry-operator
    install_operator_namespace: "{{ ocp4_workload_rhoai3x_maas_otel_namespace }}"
    install_operator_channel: "{{ ocp4_workload_rhoai3x_maas_otel_channel }}"
    install_operator_catalog: redhat-operators
    install_operator_automatic_install_plan_approval: true
    install_operator_starting_csv: ""

- name: Wait for the MonitoringStack and OpenTelemetryCollector CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: _ocp4_workload_rhoai3x_maas_obs_crd
  retries: 30
  delay: 10
  until: _ocp4_workload_rhoai3x_maas_obs_crd.resources | length == 1
  loop:
  - monitoringstacks.monitoring.rhobs
  - opentelemetrycollectors.opentelemetry.io

# COO bundles the Perses operator, whose conversion webhook
# (perses-operator-service) must be serving before the MaaS controller can apply
# the Usage dashboard/datasource — otherwise its reconcile fails transiently with
# "no endpoints available for service perses-operator-service" and the Usage tab
# shows "No datasource found" until the next 5-min reconcile. Wait it out.
- name: Wait for the Perses operator (conversion webhook) to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: perses-operator
    namespace: "{{ ocp4_workload_rhoai3x_maas_coo_namespace }}"
  register: _ocp4_workload_rhoai3x_maas_perses_op
  retries: 30
  delay: 10
  until:
  - _ocp4_workload_rhoai3x_maas_perses_op.resources | length == 1
  - (_ocp4_workload_rhoai3x_maas_perses_op.resources[0].status.readyReplicas | default(0) | int) >= 1

- name: Discover the DSCInitialization resource
  kubernetes.core.k8s_info:
    api_version: dscinitialization.opendatahub.io/v2
    kind: DSCInitialization
  register: _ocp4_workload_rhoai3x_maas_dsci

- name: Fail if no DSCInitialization is present
  ansible.builtin.fail:
    msg: >-
      No DSCInitialization found. The RHOAI operator must create it before
      monitoring can be configured.
  when: _ocp4_workload_rhoai3x_maas_dsci.resources | length == 0

- name: Enable RHOAI metrics monitoring on the DSCInitialization
  kubernetes.core.k8s:
    state: patched
    api_version: dscinitialization.opendatahub.io/v2
    kind: DSCInitialization
    name: "{{ _ocp4_workload_rhoai3x_maas_dsci.resources[0].metadata.name }}"
    definition:
      spec:
        monitoring:
          managementState: Managed
          namespace: "{{ ocp4_workload_rhoai3x_maas_monitoring_namespace }}"
          metrics:
            replicas: "{{ ocp4_workload_rhoai3x_maas_monitoring_replicas | int }}"
            storage:
              size: "{{ ocp4_workload_rhoai3x_maas_monitoring_storage_size }}"
              retention: "{{ ocp4_workload_rhoai3x_maas_monitoring_retention }}"

- name: Wait for the RHOAI monitoring stack (Thanos Querier) to become available
  # The platform Monitoring CR (default-monitoring) is the authoritative signal:
  # its ThanosQuerierAvailable condition flips True once COO + OTel have brought
  # up the Thanos/Prometheus stack in redhat-ods-monitoring. More stable than
  # matching the generated Deployment name.
  kubernetes.core.k8s_info:
    api_version: services.platform.opendatahub.io/v1alpha1
    kind: Monitoring
    name: default-monitoring
  register: _ocp4_workload_rhoai3x_maas_monitoring_cr
  retries: "{{ ocp4_workload_rhoai3x_maas_monitoring_wait_retries }}"
  delay: "{{ ocp4_workload_rhoai3x_maas_monitoring_wait_delay }}"
  until:
  - _ocp4_workload_rhoai3x_maas_monitoring_cr.resources | length == 1
  - >-
    (_ocp4_workload_rhoai3x_maas_monitoring_cr.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'ThanosQuerierAvailable')
     | selectattr('status', 'equalto', 'True') | list | length) > 0

- name: Enable Kuadrant observability (Limitador PodMonitor)
  kubernetes.core.k8s:
    state: patched
    api_version: kuadrant.io/v1beta1
    kind: Kuadrant
    name: kuadrant
    namespace: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"
    definition:
      spec:
        observability:
          enable: true

- name: Wait for the Limitador PodMonitor created by Kuadrant observability
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: PodMonitor
    name: kuadrant-limitador-monitor
    namespace: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"
  register: _ocp4_workload_rhoai3x_maas_limitador_pm
  retries: 20
  delay: 10
  until: _ocp4_workload_rhoai3x_maas_limitador_pm.resources | length == 1

- name: Configure MaaS Tenant telemetry (default off — see maas_telemetry_enabled)
  kubernetes.core.k8s:
    state: patched
    api_version: maas.opendatahub.io/v1alpha1
    kind: Tenant
    name: default-tenant
    namespace: "{{ ocp4_workload_rhoai3x_maas_namespace }}"
    definition:
      spec:
        telemetry:
          enabled: "{{ ocp4_workload_rhoai3x_maas_telemetry_enabled | bool }}"
          metrics:
            captureOrganization: "{{ ocp4_workload_rhoai3x_maas_telemetry_capture_organization | bool }}"
            captureUser: "{{ ocp4_workload_rhoai3x_maas_telemetry_capture_user | bool }}"
            captureGroup: "{{ ocp4_workload_rhoai3x_maas_telemetry_capture_group | bool }}"
            captureModelUsage: "{{ ocp4_workload_rhoai3x_maas_telemetry_capture_model_usage | bool }}"

# Terminal check: the MaaS controller creates the Usage-tab PersesDatasource
# (kuadrant-prometheus-datasource, in redhat-ods-applications) on its next Tenant
# reconcile — but only once telemetry is on AND the Perses CRD/webhook are up.
# The perses-operator requeues it on a slow (~5-15 min) cycle, and its CA-configmap
# dependency (prometheus-web-tls-ca) can land late in the run, resetting that clock.
# So use a dedicated ~20-min budget AND keep this NON-FATAL: it is purely cosmetic
# (only the dashboard Usage tab depends on it — until Available it shows
# "No datasource found"), and must not fail an otherwise-complete provision.
- name: Wait for the MaaS Usage observability datasource to be reconciled
  when: ocp4_workload_rhoai3x_maas_telemetry_enabled | bool
  kubernetes.core.k8s_info:
    api_version: perses.dev/v1alpha2
    kind: PersesDatasource
    name: kuadrant-prometheus-datasource
    namespace: redhat-ods-applications
  register: _ocp4_workload_rhoai3x_maas_usage_ds
  retries: "{{ ocp4_workload_rhoai3x_maas_usage_datasource_wait_retries }}"
  delay: "{{ ocp4_workload_rhoai3x_maas_usage_datasource_wait_delay }}"
  until:
  - _ocp4_workload_rhoai3x_maas_usage_ds.resources | length == 1
  - >-
    (_ocp4_workload_rhoai3x_maas_usage_ds.resources[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'Available')
     | selectattr('status', 'equalto', 'True') | list | length) > 0
  failed_when: false

- name: Report the Usage observability datasource status (non-fatal)
  when: ocp4_workload_rhoai3x_maas_telemetry_enabled | bool
  vars:
    _ds_available: >-
      {{ (_ocp4_workload_rhoai3x_maas_usage_ds.resources | default([])
          | map(attribute='status.conditions') | map('default', [], true) | flatten
          | selectattr('type', 'equalto', 'Available')
          | selectattr('status', 'equalto', 'True') | list | length) > 0 }}
  ansible.builtin.debug:
    msg: >-
      {{ 'MaaS Usage observability datasource is Available.' if (_ds_available | bool)
         else 'WARNING: the MaaS Usage datasource (kuadrant-prometheus-datasource) is
               still reconciling after the wait budget. The provision is complete; the
               dashboard Usage tab may show "No datasource found" until the
               perses-operator finishes its next reconcile cycle (a few more minutes).' }}
