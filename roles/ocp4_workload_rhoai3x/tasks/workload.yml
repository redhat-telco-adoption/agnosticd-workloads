---
# ---------------------------------------------------------------------------
# Provision orchestration
# Task files run in dependency order.
# ---------------------------------------------------------------------------

- name: Create NodeFeatureDiscovery instance
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  ansible.builtin.include_tasks: nfd_instance.yml

- name: Provision GPU MachineSet
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  ansible.builtin.include_tasks: gpu_machineset.yml

- name: Install NVIDIA GPU Operator
  when: ocp4_workload_rhoai3x_nvidia_gpu_operator_install | bool
  ansible.builtin.include_tasks: nvidia_gpu_operator.yml

- name: Install RHOAI Operator
  ansible.builtin.include_tasks: rhoai_operator.yml

- name: Configure DataScienceCluster
  ansible.builtin.include_tasks: datasciencecluster.yml

- name: Deploy MLflow instance
  when: ocp4_workload_rhoai3x_mlflow_deploy | bool
  ansible.builtin.include_tasks: mlflow_instance.yml

- name: Configure DataSciencePipelineApplication
  when: ocp4_workload_rhoai3x_pipeline_app_configure | bool
  ansible.builtin.include_tasks: pipeline_app.yml

- name: Deploy model via InferenceService
  when: ocp4_workload_rhoai3x_model_deploy | bool
  ansible.builtin.include_tasks: model_deployment.yml

- name: Configure Gen AI Playground (LlamaStackDistribution)
  when:
  - ocp4_workload_rhoai3x_gen_ai_studio_enable | bool
  - ocp4_workload_rhoai3x_model_deploy | bool
  ansible.builtin.include_tasks: gen_ai_playground.yml

- name: Configure AI Safety Guardrails (NeMo Guardrails)
  when:
  - ocp4_workload_rhoai3x_guardrails_enable | bool
  - ocp4_workload_rhoai3x_model_deploy | bool
  ansible.builtin.include_tasks: guardrails.yml

# --- Models-as-a-Service (optional, RHOAI 3.4+) ---------------------------
# Prerequisites first (UWM, PostgreSQL, db secret, Connectivity Link, Gateway,
# Authorino TLS), then flip the DSC/dashboard MaaS switches and verify the tenant.
- name: Enable User Workload Monitoring for Models-as-a-Service
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_uwm_enable | bool
  ansible.builtin.include_tasks: maas_user_workload_monitoring.yml

- name: Deploy PostgreSQL for Models-as-a-Service
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_deploy_postgres | bool
  ansible.builtin.include_tasks: maas_postgres.yml

- name: Create the Models-as-a-Service database secret
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_db_secret.yml

- name: Install Red Hat Connectivity Link for Models-as-a-Service
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_connectivity_link.yml

- name: Configure the Models-as-a-Service Gateway
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_gateway.yml

- name: Configure Authorino TLS for Models-as-a-Service
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_authorino_tls.yml

- name: Enable Models-as-a-Service in the DataScienceCluster and dashboard
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_enable.yml

# Re-run safety: positively detect an already-healthy MaaS BEFORE the two
# disruptive includes below, so they can be skipped on a re-run (re-applying
# them over a live MaaS corrupts the gateway auth chain — see the task file and
# the maas_skip_when_healthy default). Conservative: the fact is false unless
# every health signal confirms, so first installs and repairs still run fully.
- name: Check whether MaaS is already provisioned and healthy (re-run safety)
  when: ocp4_workload_rhoai3x_maas_enable | bool
  ansible.builtin.include_tasks: maas_health_check.yml

- name: Note that disruptive MaaS re-apply is being skipped (already healthy)
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_skip_when_healthy | bool
  - ocp4_workload_rhoai3x_maas_already_healthy | default(false) | bool
  ansible.builtin.debug:
    msg: >-
      MaaS was detected already provisioned and healthy, so the disruptive
      re-apply steps (publish sample model + observability backend) are being
      SKIPPED to avoid corrupting the live gateway auth chain. Override with
      -e ocp4_workload_rhoai3x_maas_skip_when_healthy=false to force re-application
      (e.g. for an intentional repair or upgrade).

- name: Publish a sample model to Models-as-a-Service
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_publish_sample | bool
  - not (ocp4_workload_rhoai3x_maas_skip_when_healthy | bool
         and ocp4_workload_rhoai3x_maas_already_healthy | default(false) | bool)
  ansible.builtin.include_tasks: maas_publish_sample.yml

- name: Deploy the Models-as-a-Service observability backend (Option B)
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_observability_deploy | bool
  - not (ocp4_workload_rhoai3x_maas_skip_when_healthy | bool
         and ocp4_workload_rhoai3x_maas_already_healthy | default(false) | bool)
  ansible.builtin.include_tasks: maas_observability.yml

- name: Mint MaaS API keys for the client (automated, Phase 2b)
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_client_deploy | bool
  - ocp4_workload_rhoai3x_maas_client_automint | bool
  ansible.builtin.include_tasks: maas_mint_keys.yml

- name: Deploy the MaaS client (OpenWebUI chat front-end)
  when:
  - ocp4_workload_rhoai3x_maas_enable | bool
  - ocp4_workload_rhoai3x_maas_client_deploy | bool
  ansible.builtin.include_tasks: maas_client.yml
# --------------------------------------------------------------------------
