---
# Create the maas-db-config secret in redhat-ods-applications from the resolved
# PostgreSQL connection details.
# - For the in-cluster cloudnative-pg instance, the password fact was set by
#   maas_postgres.yml.
# - For an external PG (maas_deploy_postgres=false), fall back to the provided
#   password var (set it via a vaulted extra var).

- name: Resolve the database password for the secret
  ansible.builtin.set_fact:
    _ocp4_workload_rhoai3x_maas_db_password: >-
      {{ _ocp4_workload_rhoai3x_maas_pg_password
         if (_ocp4_workload_rhoai3x_maas_pg_password is defined
              and _ocp4_workload_rhoai3x_maas_pg_password | length > 0)
         else ocp4_workload_rhoai3x_maas_pg_password }}
  no_log: true

- name: Fail early when no database password is available
  ansible.builtin.fail:
    msg: >-
      No PostgreSQL password available for maas-db-config. With
      maas_deploy_postgres=false you must set
      ocp4_workload_rhoai3x_maas_pg_password (e.g. via a vaulted extra var).
  when: _ocp4_workload_rhoai3x_maas_db_password | length == 0

- name: Create the maas-db-config secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'maas-db-config.yaml.j2') }}"
  no_log: true
