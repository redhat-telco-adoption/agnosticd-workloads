---
# ocp_username can be set by the provisioner if the workload is applied to a
# shared cluster to set up for the requesting user.
# The default, "system:admin", is used for roles deployed as part of a whole
# OpenShift cluster provision run.
ocp_username: "system:admin"

# ---------------------------------------------------------------------------
# Node Feature Discovery instance
# Stage 1 installs the NFD operator; this role creates the NodeFeatureDiscovery
# CR that starts the discovery daemonset. Namespace must match Stage 1 deployment.
# ---------------------------------------------------------------------------

# Namespace where the NFD operator from Stage 1 was installed
ocp4_workload_rhoai3x_nfd_namespace: "openshift-nfd"

# Name of the NodeFeatureDiscovery CR to create
ocp4_workload_rhoai3x_nfd_instance_name: "nfd-instance"

# ---------------------------------------------------------------------------
# GPU MachineSet
# Clone an existing worker MachineSet to provision GPU nodes on AWS.
# ---------------------------------------------------------------------------

# AWS instance type for GPU nodes (g6e family recommended for RHOAI/KServe)
ocp4_workload_rhoai3x_gpu_instance_type: "g6e.4xlarge"

# Number of GPU node replicas to provision
ocp4_workload_rhoai3x_gpu_node_count: 1

# Root EBS volume size in GB — must be large enough for NVIDIA driver images
# (~48 GB) plus any OCI model images (gpt-oss-20b is ~40 GB unpacked).
# 200 GB is the recommended minimum for single large model deployments.
ocp4_workload_rhoai3x_gpu_root_volume_size: 200
ocp4_workload_rhoai3x_gpu_root_volume_type: "gp3"

# Suffix appended to the source MachineSet's cluster infra ID to form the
# new MachineSet name, e.g. <infra-id>-gpu
ocp4_workload_rhoai3x_gpu_machineset_name_suffix: "gpu"

# How long to wait for GPU nodes to reach Ready status
ocp4_workload_rhoai3x_gpu_node_ready_retries: 40
ocp4_workload_rhoai3x_gpu_node_ready_delay: 30

# ---------------------------------------------------------------------------
# NVIDIA GPU Operator
# Installed via OLM from the certified-operators catalog.
# NFD (Stage 1) must already be running to label GPU nodes.
# ---------------------------------------------------------------------------

# Set to false to skip GPU operator installation (e.g. on clusters with no GPU nodes)
ocp4_workload_rhoai3x_nvidia_gpu_operator_install: true

# OLM channel — verify with:
#   oc get packagemanifest gpu-operator-certified -n openshift-marketplace \
#     -o jsonpath='{range .status.channels[*]}{.name}{"\n"}{end}'
ocp4_workload_rhoai3x_nvidia_gpu_operator_channel: "stable"

# Namespace where the GPU Operator is installed (cluster-scoped OperatorGroup)
ocp4_workload_rhoai3x_nvidia_gpu_operator_namespace: "nvidia-gpu-operator"

# Retries / delay for waiting on GPU Operator CSV and ClusterPolicy
ocp4_workload_rhoai3x_nvidia_gpu_operator_csv_wait_retries: 30
ocp4_workload_rhoai3x_nvidia_gpu_operator_csv_wait_delay: 20

# NVIDIA driver version is managed automatically by the OCP Driver Toolkit (DTK).
# Do NOT set driver.version/repository/image in ClusterPolicy when use_ocp_driver_toolkit: true —
# doing so causes the GPU operator to reconcile the driver DaemonSet to a different
# k8s-driver-manager version, triggering an uninstall_driver cycle that fails on OCP.

# ---------------------------------------------------------------------------
# RHOAI Operator
# Installed via OLM from the redhat-operators catalog.
# ---------------------------------------------------------------------------

# OLM channel for RHOAI 3.x
ocp4_workload_rhoai3x_operator_channel: "stable-3.x"

# Namespace where the RHOAI operator is installed
ocp4_workload_rhoai3x_operator_namespace: "redhat-ods-operator"

# Retries / delay for waiting on RHOAI CSV
ocp4_workload_rhoai3x_operator_csv_wait_retries: 45
ocp4_workload_rhoai3x_operator_csv_wait_delay: 20

# ---------------------------------------------------------------------------
# DataScienceCluster
# Enables Dashboard, Workbenches, KServe, and AI Pipelines.
# ---------------------------------------------------------------------------

# Name of the DataScienceCluster CR
ocp4_workload_rhoai3x_dsc_name: "default-dsc"

# KServe serving configuration (DSC v2 field names)
# modelsAsService = ModelMesh-based serving; Removed = KServe-only mode
ocp4_workload_rhoai3x_kserve_models_as_service_management_state: "Removed"
# rawDeploymentServiceConfig: Headless = RawDeployment mode (no Service Mesh / Serverless)
ocp4_workload_rhoai3x_kserve_raw_deployment_service_config: "Headless"

# Set to true to enable the Gen AI Studio (Playground) Tech Preview feature.
# Requires llamastackoperator: Managed in the DSC (already set above).
# Patches OdhDashboardConfig, restarts the dashboard, and creates a
# LlamaStackDistribution backed by the deployed model InferenceService.
ocp4_workload_rhoai3x_gen_ai_studio_enable: true

# LlamaStackDistribution name — appears in the Gen AI Studio project dropdown
ocp4_workload_rhoai3x_gen_ai_playground_name: "lsd-genai-playground"

# Name of the LlamaStack userConfig ConfigMap. Deliberately NOT the dashboard's
# well-known "llama-stack-config": the RHOAI 3.4 dashboard regenerates that name
# (and any configmap labelled opendatahub.io/dashboard=true) from a built-in
# template that still references the removed `agents` API, which reverts our fix
# and crashloops the pod. Using a role-owned name + no dashboard label keeps our
# config out of the dashboard's management surface.
ocp4_workload_rhoai3x_gen_ai_playground_config_name: "{{ ocp4_workload_rhoai3x_gen_ai_playground_name }}-config"

# Max tokens passed to the vLLM provider in the LlamaStack config
ocp4_workload_rhoai3x_gen_ai_playground_max_tokens: 4096

# Wait for LlamaStackDistribution to reach Ready phase
ocp4_workload_rhoai3x_gen_ai_playground_wait_retries: 20
ocp4_workload_rhoai3x_gen_ai_playground_wait_delay: 15

# Retries / delay for waiting on DataScienceCluster Ready status
ocp4_workload_rhoai3x_dsc_wait_retries: 30
ocp4_workload_rhoai3x_dsc_wait_delay: 20

# ---------------------------------------------------------------------------
# MLflow instance (optional feature — opt-in)
# Deployed in redhat-ods-applications (operator's fixed targetNamespace).
# Uses SQLite on a PVC for metadata and MinIO from Stage 1 for artifacts.
# When false, the mlflowoperator DSC component is left Removed (no operator).
# See MLFLOW-SHOWCASE.md for the demo walkthrough.
# ---------------------------------------------------------------------------

# Set to true to deploy MLflow (experiment tracking + model registry)
ocp4_workload_rhoai3x_mlflow_deploy: false

# Name of the MLflow CR
ocp4_workload_rhoai3x_mlflow_name: "mlflow"

# S3 bucket for MLflow artifacts — must exist in MinIO (created by ocp4_workload_minio)
ocp4_workload_rhoai3x_mlflow_artifact_bucket: "rhoai-models"

# PVC size for SQLite metadata store
ocp4_workload_rhoai3x_mlflow_storage_size: "10Gi"

# Retries / delay for waiting on MLflow Available condition
ocp4_workload_rhoai3x_mlflow_wait_retries: 20
ocp4_workload_rhoai3x_mlflow_wait_delay: 10

# ---------------------------------------------------------------------------
# DataSciencePipelineApplication (optional)
# Pre-creates an AI Pipelines instance pointing at the MinIO from Stage 1.
# ---------------------------------------------------------------------------

# Set to false to skip pipeline application creation
ocp4_workload_rhoai3x_pipeline_app_configure: true

# OpenShift project (namespace) where the pipeline application is created
ocp4_workload_rhoai3x_pipeline_app_project: "rhoai-shared"

# MinIO connection details — must match the ocp4_workload_minio config from Stage 1
ocp4_workload_rhoai3x_pipeline_minio_endpoint: "http://minio.minio.svc.cluster.local:9000"
ocp4_workload_rhoai3x_pipeline_minio_bucket: "rhoai-pipelines"
ocp4_workload_rhoai3x_pipeline_minio_access_key: "minio"
ocp4_workload_rhoai3x_pipeline_minio_secret_key: "minio123"

# ---------------------------------------------------------------------------
# Model deployment via KServe InferenceService
# Default: gpt-oss-20b from the Red Hat model registry (OCI ModelCar image).
# Override ocp4_workload_rhoai3x_model_name and ocp4_workload_rhoai3x_model_storage_uri
# to deploy any other vLLM-compatible model.
# ---------------------------------------------------------------------------

# Set to false to skip model deployment entirely
ocp4_workload_rhoai3x_model_deploy: true

# Namespace to deploy the model into — must be a Data Science Project
# Defaults to the shared pipeline project created by pipeline_app.yml
ocp4_workload_rhoai3x_model_namespace: "{{ ocp4_workload_rhoai3x_pipeline_app_project }}"

# Model identity
ocp4_workload_rhoai3x_model_name: "gpt-oss-20b"
ocp4_workload_rhoai3x_model_display_name: "gpt-oss-20b"

# Storage URI — OCI ModelCar (registry.redhat.io), S3 (s3://), or HuggingFace (hf://)
ocp4_workload_rhoai3x_model_storage_uri: "oci://registry.redhat.io/rhelai1/modelcar-gpt-oss-20b:1.5"

# ServingRuntime — one per model, named after the model (matches RHOAI dashboard convention)
ocp4_workload_rhoai3x_model_serving_runtime_name: "{{ ocp4_workload_rhoai3x_model_name }}"
# RHOAI 3.4 vLLM NVIDIA GPU ServingRuntime template default (runtime v0.18.0).
# Registry org moved rhaiis -> rhaii; digest-pinned to match the 3.4 dashboard template.
ocp4_workload_rhoai3x_model_serving_runtime_image: "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b"

# Additional vLLM CLI args appended after --port, --model, --served-model-name
# Example: ["--tensor-parallel-size=2", "--max-model-len=8192"]
# Note: gpt-oss-20b:1.x uses mxfp4 quantization; the RHAIIS vLLM image handles
# this natively (via Marlin kernel on non-Blackwell GPUs). No override needed.
ocp4_workload_rhoai3x_model_extra_args: []

# GPU and compute resources
ocp4_workload_rhoai3x_model_gpu_count: "1"
ocp4_workload_rhoai3x_model_cpu_requests: "1"
ocp4_workload_rhoai3x_model_cpu_limits: "2"
ocp4_workload_rhoai3x_model_memory_requests: "4Gi"
ocp4_workload_rhoai3x_model_memory_limits: "8Gi"

# Replica bounds
ocp4_workload_rhoai3x_model_min_replicas: 1
ocp4_workload_rhoai3x_model_max_replicas: 1

# Predictor request timeout (seconds) — RHOAI 3.4 deploy wizard default.
ocp4_workload_rhoai3x_model_timeout: 30

# Wait for InferenceService Ready before proceeding
# Set to false to fire-and-forget (large models can take 20+ minutes to load)
ocp4_workload_rhoai3x_model_wait_ready: true
ocp4_workload_rhoai3x_model_ready_retries: 60
ocp4_workload_rhoai3x_model_ready_delay: 30

# ---------------------------------------------------------------------------
# Models-as-a-Service (MaaS) — optional feature (RHOAI 3.4+)
# Subscription-based governance/quota for LLM serving. OFF by default.
# When enabled, this feature provisions: User Workload Monitoring, a
# PostgreSQL 14+ instance (via cloudnative-pg), the maas-db-config secret,
# Red Hat Connectivity Link (Kuadrant + Authorino + Limitador), a Gateway API
# Gateway, Authorino TLS, and flips the DSC/dashboard MaaS switches.
# See docs/maas-feature-plan.md.
# ---------------------------------------------------------------------------
ocp4_workload_rhoai3x_maas_enable: false

# --- User Workload Monitoring (without it MaaS reports Degraded) ---
ocp4_workload_rhoai3x_maas_uwm_enable: true

# --- PostgreSQL (via the cloudnative-pg operator) ---
# Set deploy_postgres=false to point maas-db-config at an external PG instead.
ocp4_workload_rhoai3x_maas_deploy_postgres: true
ocp4_workload_rhoai3x_maas_cnpg_channel: "stable-v1"
ocp4_workload_rhoai3x_maas_cnpg_catalog: "certified-operators"
# AllNamespaces install via openshift-operators (reuses the global OperatorGroup,
# so the operator watches redhat-ods-applications where the Cluster CR lives).
ocp4_workload_rhoai3x_maas_cnpg_namespace: "openshift-operators"
ocp4_workload_rhoai3x_maas_cnpg_csv_wait_retries: 30
ocp4_workload_rhoai3x_maas_cnpg_csv_wait_delay: 20
ocp4_workload_rhoai3x_maas_pg_namespace: "redhat-ods-applications"
ocp4_workload_rhoai3x_maas_pg_cluster_name: "maas-postgres"
ocp4_workload_rhoai3x_maas_pg_instances: 1
ocp4_workload_rhoai3x_maas_pg_user: "maasadmin"
# Leave empty to auto-generate (and reuse) a random password; never hardcode a
# literal here — set a fixed value only via a vaulted extra var if required.
ocp4_workload_rhoai3x_maas_pg_password: ""
ocp4_workload_rhoai3x_maas_pg_db: "maasdb"
ocp4_workload_rhoai3x_maas_pg_storage_size: "5Gi"
ocp4_workload_rhoai3x_maas_db_sslmode: "require"
# Service host/port — defaults to the in-cluster cloudnative-pg -rw service.
# Override both when using an external PG (deploy_postgres=false).
ocp4_workload_rhoai3x_maas_pg_host: "{{ ocp4_workload_rhoai3x_maas_pg_cluster_name }}-rw.{{ ocp4_workload_rhoai3x_maas_pg_namespace }}.svc.cluster.local"
ocp4_workload_rhoai3x_maas_pg_port: 5432

# --- Red Hat Connectivity Link (Kuadrant / Authorino / Limitador) ---
# rhcl-operator is AllNamespaces-only -> installs into openshift-operators (via
# install_operator). The Kuadrant instance + Authorino/Limitador live in
# kuadrant-system (matches the MaaS docs and the validated layout).
ocp4_workload_rhoai3x_maas_rhcl_channel: "stable"
ocp4_workload_rhoai3x_maas_rhcl_namespace: "openshift-operators"
ocp4_workload_rhoai3x_maas_kuadrant_namespace: "kuadrant-system"
ocp4_workload_rhoai3x_maas_rhcl_csv_wait_retries: 30
ocp4_workload_rhoai3x_maas_rhcl_csv_wait_delay: 20

# --- Gateway API ---
# Reuse the existing cluster GatewayClass (controller openshift.io/gateway-controller).
# Set create_gateway_class=true only if you need a dedicated class.
ocp4_workload_rhoai3x_maas_create_gateway_class: false
ocp4_workload_rhoai3x_maas_gateway_class_name: "data-science-gateway-class"
ocp4_workload_rhoai3x_maas_gateway_class_controller: "openshift.io/gateway-controller/v1"
ocp4_workload_rhoai3x_maas_gateway_name: "maas-default-gateway"
ocp4_workload_rhoai3x_maas_gateway_namespace: "openshift-ingress"
# Gateway Service infrastructure (ClusterIP + service-ca serving cert) and the
# external Route hostname. Leave gateway_host empty to auto-derive
# maas.<cluster-ingress-domain>.
ocp4_workload_rhoai3x_maas_gateway_config_name: "maas-gateway-config"
ocp4_workload_rhoai3x_maas_gateway_tls_secret: "maas-gw-service-tls"
ocp4_workload_rhoai3x_maas_gateway_host: ""

# --- Authorino TLS (service-ca serving cert) ---
# Authorino lives in the Kuadrant instance namespace (kuadrant-system). It runs
# clusterWide, so this namespace is just where its Deployment/Service/CR are.
ocp4_workload_rhoai3x_maas_authorino_namespace: "{{ ocp4_workload_rhoai3x_maas_kuadrant_namespace }}"
ocp4_workload_rhoai3x_maas_authorino_name: "authorino"

# --- Dashboard feature flags (both Tech Preview, accepted) ---
ocp4_workload_rhoai3x_maas_vllm_on_maas: true
# Root-cause fix: only show the "Observe & monitor -> Dashboard" UI when its
# backend (Option B, maas_observability_deploy) is actually deployed, so it never
# renders "Service Unavailable". Override to true only if you supply the backend
# some other way.
ocp4_workload_rhoai3x_maas_observability_dashboard: "{{ ocp4_workload_rhoai3x_maas_observability_deploy | bool }}"

# On teardown, also remove the cloudnative-pg and rhcl operators (Subscription +
# CSV only; the shared openshift-operators namespace/OperatorGroup are left alone).
ocp4_workload_rhoai3x_maas_remove_operators: true

# --- MaaS deployment / tenant verification ---
ocp4_workload_rhoai3x_maas_namespace: "models-as-a-service"
ocp4_workload_rhoai3x_maas_tenant_wait_retries: 30
ocp4_workload_rhoai3x_maas_tenant_wait_delay: 20

# --- Sample publish (demo LLMInferenceService + MaaSModelRef + Subscription + AuthPolicy) ---
# Deploys a small model as a vLLM-on-MaaS LLMInferenceService and governs it with
# a subscription + auth policy. MaaSModelRef only accepts LLMInferenceService or
# ExternalModel (not the legacy InferenceService used by model_deployment.yml), and
# KServe schedules whole GPUs — so this needs a SECOND GPU alongside the base model.
# Requirement: ocp4_workload_rhoai3x_gpu_node_count >= 2 (asserted at run time).
ocp4_workload_rhoai3x_maas_publish_sample: true

# Sample model — reuses the base model's oci:// modelcar (proven storage path).
# NOTE: do NOT use hf:// here — under OpenShift's arbitrary UID the HF downloader
# fails to place weights (it cannot write its atomic-replace temp file to /mnt,
# which is owned kserve:kserve 0755). oci:// modelcar copies straight into
# /mnt/models and avoids this. The LLMInferenceServiceConfig preset already uses
# the rhaii vLLM image and appends ${VLLM_ADDITIONAL_ARGS} to `vllm serve`.
ocp4_workload_rhoai3x_maas_sample_isvc_name: "maas-gpt-oss-20b"
ocp4_workload_rhoai3x_maas_sample_namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"
ocp4_workload_rhoai3x_maas_sample_model_uri: "{{ ocp4_workload_rhoai3x_model_storage_uri }}"
ocp4_workload_rhoai3x_maas_sample_model_name: "{{ ocp4_workload_rhoai3x_model_name }}"
# vLLM args appended to the preset's `vllm serve` (e.g. gpt-oss reasoning/tool parsers).
ocp4_workload_rhoai3x_maas_sample_vllm_args: "{{ ocp4_workload_rhoai3x_model_extra_args | join(' ') }}"
ocp4_workload_rhoai3x_maas_sample_replicas: 1
ocp4_workload_rhoai3x_maas_sample_gpu_count: "1"
ocp4_workload_rhoai3x_maas_sample_cpu_requests: "2"
ocp4_workload_rhoai3x_maas_sample_cpu_limits: "4"
ocp4_workload_rhoai3x_maas_sample_memory_requests: "8Gi"
ocp4_workload_rhoai3x_maas_sample_memory_limits: "16Gi"
ocp4_workload_rhoai3x_maas_sample_isvc_wait_retries: 60
ocp4_workload_rhoai3x_maas_sample_isvc_wait_delay: 30

# Gen AI asset metadata — required for the model to appear under
# Gen AI studio -> AI asset endpoints in the dashboard.
ocp4_workload_rhoai3x_maas_sample_display_name: "gpt-oss-20b (MaaS)"
ocp4_workload_rhoai3x_maas_sample_description: "gpt-oss-20b published via Models-as-a-Service"
ocp4_workload_rhoai3x_maas_sample_genai_use_case: "chat"

# Governance objects
ocp4_workload_rhoai3x_maas_modelref_name: "{{ ocp4_workload_rhoai3x_maas_sample_isvc_name }}"
ocp4_workload_rhoai3x_maas_subscription_name: "rhoai-team"
ocp4_workload_rhoai3x_maas_authpolicy_name: "rhoai-team-auth"
ocp4_workload_rhoai3x_maas_subscription_group: "rhoai-users"
# Members of the subscription group (must exist as OpenShift users to consume MaaS).
ocp4_workload_rhoai3x_maas_subscription_group_users:
- admin
ocp4_workload_rhoai3x_maas_token_limit: 1000000
# Window units: s/m/h only (no days) — e.g. "24h", not "1d".
ocp4_workload_rhoai3x_maas_token_window: "1h"

# ---------------------------------------------------------------------------
# AI Safety Guardrails — NeMo Guardrails via TrustyAI — optional feature (opt-in)
# Puts a NeMo Guardrails service in front of the deployed model and applies
# Presidio-backed PII / sensitive-data detection on inputs and outputs.
# Requires a deployed model (model_deploy) and sets the TrustyAI DSC component
# to Managed. The CR + SA + Secret + ConfigMap live in the model's namespace.
# See GUARDRAILS-SHOWCASE.md for the demo walkthrough.
# ---------------------------------------------------------------------------
ocp4_workload_rhoai3x_guardrails_enable: false

# Namespace for all guardrails objects — must match the model's namespace.
ocp4_workload_rhoai3x_guardrails_namespace: "{{ ocp4_workload_rhoai3x_model_namespace }}"

# Names (the operator derives the Deployment/Service/Route from the CR name).
ocp4_workload_rhoai3x_guardrails_name: "nemo-guardrails"
ocp4_workload_rhoai3x_guardrails_config_name: "nemo-guardrails-config"
ocp4_workload_rhoai3x_guardrails_sa_name: "nemo-guardrails-service-account"
ocp4_workload_rhoai3x_guardrails_token_secret: "api-token-secret"

# The model NeMo guards. Defaults to the model deployed by this role.
ocp4_workload_rhoai3x_guardrails_model_name: "{{ ocp4_workload_rhoai3x_model_name }}"
# OpenAI-compatible base URL of the model predictor (raw KServe headless svc,
# HTTP on port 80, path /v1). Override if your serving mode differs (e.g. TLS:8443).
ocp4_workload_rhoai3x_guardrails_model_predictor_url: "http://{{ ocp4_workload_rhoai3x_guardrails_model_name }}-predictor.{{ ocp4_workload_rhoai3x_guardrails_namespace }}.svc.cluster.local/v1"

# Presidio entity types to detect on input and output (case-sensitive).
ocp4_workload_rhoai3x_guardrails_pii_entities_input:
- EMAIL_ADDRESS
- PERSON
- CREDIT_CARD
- PHONE_NUMBER
ocp4_workload_rhoai3x_guardrails_pii_entities_output:
- PERSON

ocp4_workload_rhoai3x_guardrails_replicas: 1
# Wait for the NeMo Guardrails Deployment to become ready.
ocp4_workload_rhoai3x_guardrails_wait_retries: 30
ocp4_workload_rhoai3x_guardrails_wait_delay: 10

# ---------------------------------------------------------------------------
# MaaS Observability backend (Option B) — optional MaaS sub-feature (opt-in)
# Deploys the monitoring stack behind the RHOAI "Observe & monitor -> Dashboard"
# (Tech Preview): Cluster Observability Operator + DSCInitialization metrics
# (Thanos/Prometheus in redhat-ods-monitoring) + Kuadrant observability + Tenant
# telemetry. Heavy + cluster-wide; only runs when maas_enable is also true.
# When true it also turns on the observabilityDashboard UI flag (see above).
# See MAAS-SHOWCASE.md §4.
# ---------------------------------------------------------------------------
ocp4_workload_rhoai3x_maas_observability_deploy: false

# Cluster Observability Operator (may be shared with other workloads).
ocp4_workload_rhoai3x_maas_coo_namespace: "openshift-cluster-observability-operator"
ocp4_workload_rhoai3x_maas_coo_channel: "stable"

# RHOAI monitoring stack (DSCInitialization.spec.monitoring.metrics).
ocp4_workload_rhoai3x_maas_monitoring_namespace: "redhat-ods-monitoring"
ocp4_workload_rhoai3x_maas_monitoring_replicas: 1
ocp4_workload_rhoai3x_maas_monitoring_storage_size: "20Gi"
ocp4_workload_rhoai3x_maas_monitoring_retention: "15d"
ocp4_workload_rhoai3x_maas_monitoring_wait_retries: 40
ocp4_workload_rhoai3x_maas_monitoring_wait_delay: 15

# Tenant telemetry capture flags. captureUser/Group default off (privacy +
# Prometheus cardinality); enable captureUser for the per-user token table.
ocp4_workload_rhoai3x_maas_telemetry_capture_organization: true
ocp4_workload_rhoai3x_maas_telemetry_capture_user: false
ocp4_workload_rhoai3x_maas_telemetry_capture_group: false
ocp4_workload_rhoai3x_maas_telemetry_capture_model_usage: true

# On teardown, also remove COO + revert DSCI monitoring. OFF by default because
# COO is frequently shared with other workloads (e.g. coo_incident_detection);
# removing it would break them. Only enable on a cluster where this role owns COO.
ocp4_workload_rhoai3x_maas_observability_remove_coo: false
